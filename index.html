<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reggie & Angelika — Wedding Invitation</title>
<style>
:root{--cream:#f8f4ec;--paper:#fffdf8;--ink:#3f4037;--gold:#b79b63;--line:#ded8ca}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}

/* Envelope Screen Overlay */
#envelope-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#2b3430;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;transition:opacity 0.8s ease, transform 0.8s ease;cursor:pointer;padding:20px;text-align:center}
#envelope-screen.fade-out{opacity:0;transform:scale(1.05);pointer-events:none}

.env-header{font-family:Georgia,serif;font-style:italic;font-size:28px;color:#f3eee2;margin-bottom:30px;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,0.3)}

/* Realistic Deckle-Edge Envelope Container */
.envelope{width:360px;height:240px;background:#fbfaf7;position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.4);border-radius:2px;transition:transform 0.3s ease;overflow:hidden;background-image:radial-gradient(#f1eee5 15%, transparent 16%), radial-gradient(#ece6da 15%, transparent 16%);background-size:12px 12px}
.envelope:hover{transform:translateY(-3px)}

/* Envelope Flaps (Creating the V-folds) */
.envelope-flap-top{position:absolute;top:0;left:0;width:0;height:0;border-left:180px solid transparent;border-right:180px solid transparent;border-top:125px solid #ece6da;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.05))}
.envelope-flap-left{position:absolute;top:0;left:0;width:0;height:0;border-top:120px solid transparent;border-bottom:120px solid transparent;border-left:180px solid #f4efe6}
.envelope-flap-right{position:absolute;top:0;right:0;width:0;height:0;border-top:120px solid transparent;border-bottom:120px solid transparent;border-right:180px solid #f4efe6}
.envelope-flap-bottom{position:absolute;bottom:0;left:0;width:0;height:0;border-left:180px solid transparent;border-right:180px solid transparent;border-bottom:115px solid #eae3d5}

/* Yellow Wax Seal positioned at the center flap meeting point */
.wax-seal-wrapper{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);z-index:10}
.wax-seal{width:64px;height:64px;background:radial-gradient(circle, #dfbc6d 0%, #b79b63 70%, #967c46 100%);border-radius:50%;box-shadow:0 6px 15px rgba(0,0,0,0.3);display:flex;justify-content:center;align-items:center;color:#fffdf8;font-family:Georgia,serif;font-weight:bold;font-size:18px;border:2px dashed rgba(255,255,255,0.4)}

.env-footer{margin-top:35px;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#e2dad0;text-shadow:0 1px 2px rgba(0,0,0,0.3);animation:pulse 2s infinite}

@keyframes pulse{0%{opacity:0.6}50%{opacity:1}100%{opacity:0.6}}

/* Main Scroll Content Container */
#invitation-app{opacity:0;transform:translateY(20px);transition:opacity 1s ease 0.3s, transform 1s ease 0.3s;pointer-events:none;max-width:800px;margin:auto;padding:20px 16px 60px}
#invitation-app.visible{opacity:1;transform:translateY(0);pointer-events:auto}

/* Navigation Bar Styling */
.top-nav{margin-bottom:15px;display:flex;justify-content:flex-start}
.bottom-nav{margin-top:25px;display:flex;justify-content:center}
.btn-back{background:none;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block;transition:all 0.2s ease}
.btn-back:hover{background:var(--gold);color:#fff}

/* Image Scroll Styling */
.image-scroll-container{display:flex;flex-direction:column;gap:20px}
.invitation-page{width:100%;height:auto;display:block;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,0.06);border:1px solid var(--line);background:var(--paper)}
</style>
</head>
<body>

<!-- BACKGROUND AUDIO -->
<audio id="bgAudio" src="HENRY - It's You (Violin Version).mp3" loop preload="auto"></audio>

<!-- ENVELOPE INTRO SCREEN -->
<div id="envelope-screen" onclick="openEnvelope()">
  <div class="env-header">You are invited!</div>
  
  <div class="envelope">
    <div class="envelope-flap-top"></div>
    <div class="envelope-flap-left"></div>
    <div class="envelope-flap-right"></div>
    <div class="envelope-flap-bottom"></div>
    
    <div class="wax-seal-wrapper">
      <div class="wax-seal">F&A</div>
    </div>
  </div>
  
  <div class="env-footer">Click the seal to open</div>
</div>

<!-- MAIN INVITATION CONTENT CONTAINING PAGE IMAGES -->
<div id="invitation-app">
  <!-- Top Navigation Back Button -->
  <div class="top-nav">
    <a href="#" class="btn-back" onclick="history.back(); return false;">← Back to Portal</a>
  </div>

  <div class="image-scroll-container">
    <img src="page_1.jpg" alt="Wedding Invitation - Page 1" class="invitation-page">
    <img src="page_2.jpg" alt="Wedding Entourage - Page 2" class="invitation-page">
    <img src="page_3.jpg" alt="Wedding Entourage - Page 3" class="invitation-page">
    <img src="page_4.jpg" alt="Wedding Details - Page 4" class="invitation-page">
  </div>

  <!-- Bottom Navigation Back Button -->
  <div class="bottom-nav">
    <a href="#" class="btn-back" onclick="history.back(); return false;">← Back to Portal</a>
  </div>
</div>

<script>
function openEnvelope() {
  // Play background music on repeat
  const audio = document.getElementById("bgAudio");
  audio.play().catch(error => {
    console.log("Audio playback prevented or failed:", error);
  });

  const screen = document.getElementById("envelope-screen");
  const app = document.getElementById("invitation-app");
  
  screen.classList.add("fade-out");
  app.classList.add("visible");
  
  // Completely hide overlay after transition
  setTimeout(() => {
    screen.style.display = "none";
  }, 800);
}
</script>

</body>
</html>
