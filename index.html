<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reggie & Angelika — Wedding Invitation</title>
<style>
:root{--cream:#f8f4ec;--paper:#fffdf8;--ink:#3f4037;--gold:#b79b63;--line:#ded8ca}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}

/* Envelope Screen Overlay */
#envelope-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#2b2f2a;background-image:radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;transition:opacity 0.9s ease;padding:20px;text-align:center}
#envelope-screen.fade-out{opacity:0;pointer-events:none}

.env-title{color:#fff;font-size:28px;font-style:italic;letter-spacing:1px;margin-bottom:28px;font-weight:normal;text-shadow:0 2px 4px rgba(0,0,0,0.5)}

/* Larger Realistic Envelope Design */
.envelope-wrapper{position:relative;width:440px;height:300px;cursor:pointer;filter:drop-shadow(0 25px 35px rgba(0,0,0,0.5));transition:transform 0.4s ease}
.envelope-wrapper:hover{transform:translateY(-5px)}

.envelope-body{position:absolute;width:100%;height:100%;background:#fbf9f4;background-image:radial-gradient(circle at 50% 50%, #fffdfa 0%, #f2ede2 100%);border-radius:4px;overflow:hidden;border:1px solid #dcd4c3}

/* Envelope Creases / Flaps with clear defining lines */
.flap-left{position:absolute;top:0;left:0;width:0;height:0;border-top:150px solid transparent;border-bottom:150px solid transparent;border-left:220px solid rgba(60,50,40,0.08);filter:drop-shadow(1px 0 0 rgba(60,50,40,0.12))}
.flap-right{position:absolute;top:0;right:0;width:0;height:0;border-top:150px solid transparent;border-bottom:150px solid transparent;border-right:220px solid rgba(60,50,40,0.08);filter:drop-shadow(-1px 0 0 rgba(60,50,40,0.12))}
.flap-bottom{position:absolute;bottom:0;left:0;width:0;height:0;border-left:220px solid transparent;border-right:220px solid transparent;border-bottom:150px solid rgba(60,50,40,0.1);filter:drop-shadow(0 -1px 0 rgba(60,50,40,0.15))}

/* Top Flap that opens with clear outline crease */
.flap-top{position:absolute;top:0;left:0;width:0;height:0;border-left:220px solid transparent;border-right:220px solid transparent;border-top:145px solid #eae2d0;transform-origin:top;transition:transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);z-index:3;filter:drop-shadow(0 2px 2px rgba(60,50,40,0.15))}
.envelope-wrapper.opening .flap-top{transform:rotateX(180deg);z-index:0}

/* Perfectly Aligned Golden Wax Seal with F&A.jpg logo */
.wax-seal{position:absolute;top:145px;left:50%;transform:translate(-50%, -50%);width:78px;height:78px;background:radial-gradient(circle at 35% 35%, #f6d67b 0%, #d4af37 65%, #8c6d12 100%);border-radius:50%;box-shadow:0 5px 15px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.7), inset 0 -3px 4px rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:4;border:2px solid #b39023;transition:transform 0.3s ease, opacity 0.3s ease;overflow:hidden}
.envelope-wrapper.opening .wax-seal{transform:translate(-50%, -50%) scale(1.2);opacity:0}

/* Seal logo image styling optimized for clarity */
.wax-seal img{width:100%;height:100%;object-fit:cover;filter:contrast(1.1);opacity:1}

.env-instruction{color:#e2d9c5;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-top:32px;animation:pulse 2s infinite;text-shadow:0 1px 2px rgba(0,0,0,0.5)}

@keyframes pulse{0%{opacity:0.6}50%{opacity:1}100%{opacity:0.6}}

/* Main Scroll Content Container */
#invitation-app{opacity:0;transform:translateY(30px);transition:opacity 1s ease 0.4s, transform 1s ease 0.4s;pointer-events:none;max-width:800px;margin:auto;padding:20px 16px 60px}
#invitation-app.visible{opacity:1;transform:translateY(0);pointer-events:auto}

/* Navigation Bar Styling */
.top-nav{margin-bottom:15px;display:flex;justify-content:flex-start}
.bottom-nav{margin-top:25px;display:flex;justify-content:center}
.btn-back{background:none;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block;transition:all 0.2s ease}
.btn-back:hover{background:var(--gold);color:#fff}

/* Image Scroll Styling */
.image-scroll-container{display:flex;flex-direction:column;gap:20px}
.invitation-page{width:100%;height:auto;display:block;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,0.06);border:1px solid var(--line);background:var(--paper)}
</style>
</head>
<body>

<!-- BACKGROUND AUDIO -->
<audio id="bgAudio" src="HENRY - It's You (Violin Version).mp3" loop preload="auto"></audio>

<!-- ENVELOPE INTRO SCREEN -->
<div id="envelope-screen">
  <div class="env-title">You are invited!</div>
  
  <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
    <div class="envelope-body">
      <div class="flap-left"></div>
      <div class="flap-right"></div>
      <div class="flap-bottom"></div>
      <div class="flap-top"></div>
    </div>
    <div class="wax-seal">
      <img src="F&A.jpg" alt="F&A Logo">
    </div>
  </div>

  <div class="env-instruction">CLICK THE SEAL TO OPEN</div>
</div>

<!-- MAIN INVITATION CONTENT CONTAINING PAGE IMAGES -->
<div id="invitation-app">
  <!-- Top Navigation Back Button -->
  <div class="top-nav">
    <a href="https://aya-bloom.my.canva.site/fox-anj/page-2" class="btn-back" onclick="goBackToPortal(event)">← Back to Portal</a>
  </div>

  <div class="image-scroll-container">
    <img src="Page_1.jpeg" alt="Wedding Invitation - Page 1" class="invitation-page">
    <img src="page_2.jpg" alt="Wedding Entourage - Page 2" class="invitation-page">
    <img src="page_3.jpg" alt="Wedding Entourage - Page 3" class="invitation-page">
    <img src="page_4.jpg" alt="Wedding Details - Page 4" class="invitation-page">
  </div>

  <!-- Bottom Navigation Back Button -->
  <div class="bottom-nav">
    <a href="https://aya-bloom.my.canva.site/fox-anj/page-2" class="btn-back" onclick="goBackToPortal(event)">← Back to Portal</a>
  </div>
</div>

<script>
function openEnvelope() {
  const wrapper = document.getElementById("envelopeWrapper");
  const screen = document.getElementById("envelope-screen");
  const app = document.getElementById("invitation-app");
  
  // Play background music on repeat
  const audio = document.getElementById("bgAudio");
  audio.play().catch(error => {
    console.log("Audio playback prevented or failed:", error);
  });

  // Trigger flap opening animation
  wrapper.classList.add("opening");

  // Fade out screen overlay and fade in the invitation scroll after flap starts opening
  setTimeout(() => {
    screen.classList.add("fade-out");
    app.classList.add("visible");
  }, 400);
  
  // Completely remove overlay element from layout after transitions finish
  setTimeout(() => {
    screen.style.display = "none";
  }, 1300);
}

function goBackToPortal(event) {
  event.preventDefault();
  
  // Check if we can navigate back in browser history
  if (window.history.length > 1) {
    // Set a flag in session storage so the destination page knows to scroll to bottom upon return
    sessionStorage.setItem('scrollToBottom', 'true');
    window.history.back();
  } else {
    // Fallback if opened directly in a fresh tab
    window.location.href = "https://aya-bloom.my.canva.site/fox-anj/page-2#bottom";
  }
}

// Automatically scroll to the bottom with a delay/loop check if returning via history back
window.addEventListener('pageshow', function() {
  if (sessionStorage.getItem('scrollToBottom') === 'true') {
    sessionStorage.removeItem('scrollToBottom');
    
    // Use a small loop/timeout delay to ensure page images have loaded and document height is expanded
    let attempts = 0;
    const checkHeightAndScroll = setInterval(() => {
      attempts++;
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      
      // Stop checking after ~1 second or if max height is reached
      if (attempts > 10) {
        clearInterval(checkHeightAndScroll);
      }
    }, 100);
  }
});
</script>

</body>
</html>
