<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reggie & Angelika — Wedding Invitation</title>
<style>
:root{
  --cream:#f8f4ec;
  --paper:#fffdf8;
  --ink:#3f4037;
  --sage:#7d8a70;
  --gold:#b79b63;
  --line:#ded8ca;
  --error:#9b4d42;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}

/* Intro Screen Overlay - Clean White Background */
#envelope-screen{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:#ffffff;
  background-image:radial-gradient(circle, #ffffff 0%, #f4f4f4 100%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  z-index:999;transition:opacity 0.9s ease;padding:20px;text-align:center;
}
#envelope-screen.fade-out{opacity:0;pointer-events:none}

.env-title{color:#3f4037;font-size:28px;font-style:italic;letter-spacing:1px;margin-bottom:32px;font-weight:normal;text-shadow:0 1px 2px rgba(0,0,0,0.05)}

/* Scroll Container & Wrapper */
.scroll-wrapper{
  position:relative;
  width:360px;
  height:140px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  transition:transform 0.4s ease;
  filter:drop-shadow(0 15px 25px rgba(0,0,0,0.12));
}
.scroll-wrapper:hover{transform:translateY(-4px)}

/* Individual Scroll Images */
.scroll-piece{
  width:100%;
  height:auto;
  object-fit:contain;
  display:block;
  z-index:2;
  transition:transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
}

/* Unscrolling Animation States */
.scroll-wrapper.opening .scroll-top {
  transform: translateY(-90px);
  opacity: 0;
}
.scroll-wrapper.opening .scroll-bottom {
  transform: translateY(90px);
  opacity: 0;
}

/* F&A Logo centered between scrolls */
.scroll-logo{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:56px;
  height:56px;
  border-radius:50%;
  overflow:hidden;
  z-index:3;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
  border:2px solid var(--gold);
  transition:transform 0.4s ease, opacity 0.4s ease;
}
.scroll-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.scroll-wrapper.opening .scroll-logo{
  transform:translate(-50%, -50%) scale(1.3);
  opacity:0;
}

/* Yellow Petals Burst Animation Container */
#petal-container {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 1000;
  overflow: hidden;
}
.petal {
  position: absolute;
  background: var(--gold);
  border-radius: 150% 0 150% 0;
  opacity: 0.85;
  transform: scale(0);
  animation: burstPetal 1.2s forwards cubic-bezier(0.1, 0.8, 0.3, 1);
}
@keyframes burstPetal {
  0% {
    transform: translate(0, 0) scale(0.2) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot));
    opacity: 0;
  }
}

.env-instruction{color:#7d8a70;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-top:36px;animation:pulse 2s infinite;}

@keyframes pulse{0%{opacity:0.6}50%{opacity:1}100%{opacity:0.6}}

/* Main Scroll Content Container */
#invitation-app{
  opacity:0;
  transform:translateY(30px);
  max-height:0;
  overflow:hidden;
  transition:opacity 1s ease 0.4s, transform 1s ease 0.4s, max-height 1.2s ease 0.4s;
  pointer-events:none;
  max-width:800px;
  margin:auto;
  padding:0 16px;
}
#invitation-app.visible{
  opacity:1;
  transform:translateY(0);
  max-height:5000px;
  pointer-events:auto;
  padding:20px 16px 60px;
}

/* Navigation Bar Styling */
.top-nav{margin-bottom:15px;display:flex;justify-content:flex-start}
.bottom-nav{margin-top:25px;display:flex;justify-content:center}
.btn-back{background:none;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block;transition:all 0.2s ease}
.btn-back:hover{background:var(--gold);color:#fff}

/* Image Scroll Styling */
.image-scroll-container{display:flex;flex-direction:column;gap:20px}
.invitation-page{width:100%;height:auto;display:block;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,0.06);border:1px solid var(--line);background:var(--paper)}
</style>
</head>
<body>

<!-- BACKGROUND AUDIO -->
<audio id="bgAudio" src="HENRY - It's You (Violin Version).mp3" loop preload="auto"></audio>

<!-- PETAL BURST CONTAINER -->
<div id="petal-container"></div>

<!-- SCROLL INTRO SCREEN -->
<div id="envelope-screen">
  <div class="env-title">You are invited!</div>
  
  <div class="scroll-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
    <img src="top scroll.png" alt="Top Scroll" class="scroll-piece scroll-top">
    <div class="scroll-logo" id="scrollLogo">
      <img src="F&A.jpg" alt="F&A Logo">
    </div>
    <img src="bottom scroll.png" alt="Bottom Scroll" class="scroll-piece scroll-bottom">
  </div>

  <div class="env-instruction">CLICK THE SCROLL TO OPEN</div>
</div>

<!-- MAIN INVITATION CONTENT CONTAINING PAGE IMAGES -->
<div id="invitation-app">
  <!-- Top Navigation Back Button -->
  <div class="top-nav">
    <a href="https://aya-bloom.my.canva.site/fox-anj/page-2" class="btn-back" onclick="goBackToPortal(event)">← Back to Portal</a>
  </div>

  <div class="image-scroll-container">
    <img src="Page_1.jpeg" alt="Wedding Invitation - Page 1" class="invitation-page">
    <img src="page_2.jpg" alt="Wedding Entourage - Page 2" class="invitation-page">
    <img src="page_3.jpg" alt="Wedding Entourage - Page 3" class="invitation-page">
    <img src="page_4.jpg" alt="Wedding Details - Page 4" class="invitation-page">
  </div>

  <!-- Bottom Navigation Back Button -->
  <div class="bottom-nav">
    <a href="https://aya-bloom.my.canva.site/fox-anj/page-2" class="btn-back" onclick="goBackToPortal(event)">← Back to Portal</a>
  </div>
</div>

<script>
function createPetalBurst() {
  const container = document.getElementById('petal-container');
  const numPetals = 25;
  const rect = document.getElementById('envelopeWrapper').getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  for (let i = 0; i < numPetals; i++) {
    const petal = document.createElement('div');
    petal.classList.add('petal');
    
    const size = Math.random() * 12 + 8;
    petal.style.width = size + 'px';
    petal.style.height = (size * 1.6) + 'px';
    petal.style.left = centerX + 'px';
    petal.style.top = centerY + 'px';

    const colors = ['var(--gold)', '#d4af37', '#f6d67b', '#b79b63', '#fffdf8'];
    petal.style.background = colors[Math.floor(Math.random() * colors.length)];

    const angle = Math.random() * Math.PI * 2;
    const distance = Math.random() * 220 + 80;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance;
    const rotation = Math.random() * 360;

    petal.style.setProperty('--dx', `${dx}px`);
    petal.style.setProperty('--dy', `${dy}px`);
    petal.style.setProperty('--rot', `${rotation}deg`);

    container.appendChild(petal);

    setTimeout(() => {
      petal.remove();
    }, 1200);
  }
}

function openEnvelope() {
  const wrapper = document.getElementById("envelopeWrapper");
  const screen = document.getElementById("envelope-screen");
  const app = document.getElementById("invitation-app");
  
  const audio = document.getElementById("bgAudio");
  audio.play().catch(error => {
    console.log("Audio playback prevented or failed:", error);
  });

  createPetalBurst();
  wrapper.classList.add("opening");

  setTimeout(() => {
    screen.classList.add("fade-out");
    app.classList.add("visible");
  }, 350);
  
  setTimeout(() => {
    screen.style.display = "none";
  }, 1200);
}

function goBackToPortal(event) {
  event.preventDefault();
  
  if (window.history.length > 1) {
    sessionStorage.setItem('scrollToBottom', 'true');
    window.history.back();
  } else {
    window.location.href = "https://aya-bloom.my.canva.site/fox-anj/page-2#bottom";
  }
}

window.addEventListener('pageshow', function() {
  if (sessionStorage.getItem('scrollToBottom') === 'true') {
    sessionStorage.removeItem('scrollToBottom');
    
    let attempts = 0;
    const checkHeightAndScroll = setInterval(() => {
      attempts++;
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      
      if (attempts > 10) {
        clearInterval(checkHeightAndScroll);
      }
    }, 100);
  }
});
</script>

</body>
</html>
